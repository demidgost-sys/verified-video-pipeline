name: Deep lifecycle model

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: python -m pip install --no-deps .
      - name: Run bounded deep model
        env:
          VVP_MODEL_PROFILE: deep
        run: python -m unittest discover -s tests -p test_model.py -v
